# 서버(mini)의 ~/doro-gateway 에 두는 compose 의 원본. 서버 사본은 scripts/setup-gateway-server.sh 가 처음 한 번 복사하고, 배포는 덮어쓰지 않는다.
# Doro 의 Postgres·IAM 과 같은 도커 네트워크(doro_doro-network)에 붙어 이름(postgres, auth-api)으로 찾는다.
# 컨테이너 이름 doro-bff-api 는 게이트웨이(nginx)의 upstream 이름이라 바꾸지 않는다.
# 값은 같은 폴더의 .env(서버에만 있다)에서 읽는다: DB_USER, DB_PASSWORD, BFF_SESSION_KEY, BFF_IAM_INTERNAL_TOKEN, DORO_IAM_ISSUER, BFF_PUBLIC_ORIGIN(선택).
x-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bff-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: doro-bff:latest
    container_name: doro-bff-api
    restart: unless-stopped
    logging: *app-logging
    ports:
      - "127.0.0.1:${BFF_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BFF_DB:-doro_bff}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER must be set in .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      IAM_HOST: auth-api
      IAM_PORT: 8080
      DORO_IAM_ISSUER: ${DORO_IAM_ISSUER:?DORO_IAM_ISSUER must be set in .env}
      # 탈퇴 동기화(IAM 내부 API)용 서비스 토큰. IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'bff:<토큰>' 으로 등록한 값이다. 없으면 동기화는 실패 로그만 남긴다.
      DORO_IAM_INTERNAL_TOKEN: ${BFF_IAM_INTERNAL_TOKEN:-}
      # 토큰·PKCE verifier 를 DB 에 암호화해 두는 키(openssl rand -base64 32). 바꾸면 모든 BFF 세션이 무효가 된다(다시 로그인).
      BFF_SESSION_KEY: ${BFF_SESSION_KEY:?BFF_SESSION_KEY must be set in .env}
      BFF_COOKIE_SECURE: "true"
      # 브라우저가 보는 공개 주소(기본: IAM issuer 와 같다). 서비스별 redirect_uri 는 IAM 의 OAuth 클라이언트에 등록한 값과 같아야 한다.
      BFF_OAUTH_AUTHORIZE_URL: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER}}/oauth2/authorize
      BLOG_WEB_BASE_PATH: /dev/blog
      BLOG_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER}}/dev/blog/api/v1/bff/callback
      PARTY_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER}}/party/api/v1/bff/callback
      GAMES_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER}}/games/api/v1/bff/callback
      INTERVIEW_WEB_BASE_PATH: /dev/interview
      INTERVIEW_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER}}/dev/interview/api/v1/bff/callback
    networks:
      - doro-network

networks:
  doro-network:
    external: true
    name: doro_doro-network
